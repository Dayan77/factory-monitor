# CI — roda em todo push e pull request. Nada vai para `main` vermelho:
# proteja a branch exigindo os jobs abaixo (Settings → Branches → Require status checks).
# Actions fixadas por SHA de commit (a tag fica no comentário). Para atualizar:
#   git ls-remote --tags https://github.com/<owner>/<action> | grep 'v4.4.0^{}'  (ou a tag leve, se não houver ^{})
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Server (FastAPI) ─────────────────────────────────────────────
  server:
    name: server · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: factory_monitor
          POSTGRES_USER: fm_user
          POSTGRES_PASSWORD: fm_dev_password   # banco efêmero do CI, não é segredo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm_user -d factory_monitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
      influxdb:
        image: influxdb:2.7.12-alpine
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: ci-admin-password
          DOCKER_INFLUXDB_INIT_ORG: factory-monitor
          DOCKER_INFLUXDB_INIT_BUCKET: sensors
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-change-me
        ports: ["8086:8086"]
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fm_user
      POSTGRES_PASSWORD: fm_dev_password
      INFLUX_URL: http://localhost:8086
      INFLUX_TOKEN: dev-token-change-me
      INFLUX_ORG: factory-monitor
      INFLUX_BUCKET: sensors
      MQTT_BROKER_HOST: localhost
      MQTT_BROKER_PORT: "1883"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Mosquitto precisa do nosso mosquitto.conf (a config padrão da imagem só
      # escuta em loopback) — por isso não é um `service` do job.
      - name: Start mosquitto
        run: |
          docker run -d --name ci_mosquitto -p 1883:1883 \
            -v "$PWD/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for _ in $(seq 1 20); do
            docker exec ci_mosquitto mosquitto_pub -h localhost -t health -m ping && exit 0
            sleep 1
          done
          docker logs ci_mosquitto; exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r server/requirements-dev.txt -r scripts/requirements.txt
          pip check

      - name: Alembic upgrade head (banco limpo)
        working-directory: server
        env:
          POSTGRES_DB: factory_monitor
        run: alembic upgrade head

      - name: Casos da especificação de KPIs (docs/kpis.md)
        working-directory: server
        env:
          FM_TEST_DB: fm_test_kpi
        run: python -m pytest -q tests/test_kpi_spec_cases.py

      - name: Cenários de ouro (docs/scenarios — oráculo + conformidade com o server)
        run: python -m pytest -q docs/scenarios

      - name: pytest (server)
        working-directory: server
        env:
          FM_TEST_DB: fm_test_server
        run: python -m pytest -q

      - name: pytest (scripts de operação)
        run: python -m pytest -q scripts/tests

  # ── Edge (gateway / simulador) ───────────────────────────────────
  edge:
    name: edge · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: edge/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r edge/requirements-dev.txt
          pip check

      - name: Import smoke test
        run: python -c "import edge.app, edge.src.gateway, edge.src.simulator"

      - name: pytest (edge)
        run: |
          if [ -d edge/tests ]; then
            python -m pytest -q edge/tests
          else
            echo "::warning::edge/tests não existe — nenhum teste de edge executado"
          fi

      - name: Server + edge no mesmo ambiente (sem conflito de dependências)
        run: |
          pip install -r server/requirements.txt
          pip check

  # ── Web (React + TS) ─────────────────────────────────────────────
  web:
    name: web · tsc + vitest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  # ── Site público (Astro estático) ────────────────────────────────
  site:
    name: site · astro check + vitest + build + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Typecheck (astro check)
        run: npx astro check
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx astro build
      - name: E2E no navegador (Playwright, desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          node tests/e2e.mjs
      - name: nginx do site (template com envsubst)
        run: |
          docker run --rm -e SITE_CONNECT_SRC=https://app.factoryconnect.tech \
            -v "$PWD/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/dist:/usr/share/nginx/html:ro" nginx:1.30.5-alpine \
            sh -c '/docker-entrypoint.sh nginx -t'
      - name: Roteamento de domínios (Traefik v3 e v2 com os labels de produção)
        run: python3 tests/traefik_routing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: site-screenshots
          path: site/test-results/screens
          retention-days: 7

  # ── Infra: compose, nginx, scripts, mosquitto, Traefik, monitoring ─
  infra:
    name: infra · compose + nginx + shell + actionlint + mosquitto/traefik/monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: .env de CI a partir do exemplo
        run: |
          grep -vE '^\s*(#|$)' .env.example | sed 's/[[:space:]]*#.*$//' > .env
          {
            echo "INFLUX_ADMIN_PASSWORD=ci-only"
            echo "MQTT_USERNAME=fm-backend"            # prod exige credencial MQTT do backend
            echo "MQTT_PASSWORD=ci-only-mqtt-password"
          } >> .env
      - name: docker compose config (dev e prod, com e sem o profile monitoring)
        run: |
          for f in infra/docker-compose.yml infra/docker-compose.prod.yml; do
            docker compose --env-file .env -f "$f" config -q
            docker compose --env-file .env -f "$f" --profile monitoring config -q
          done
      - name: Imagens com versão fixa (sem :latest em imagens de terceiros)
        run: |
          bad=$(grep -hE '^\s*image:' infra/docker-compose*.yml .github/workflows/*.yml \
                | sed -E 's/^\s*image:\s*//; s/\s*#.*$//' | grep -v '^factory-monitor-' \
                | grep -vE ':[0-9v][^:]*$' || true)
          if [ -n "$bad" ]; then echo "::error::imagens sem versão fixa:"; echo "$bad"; exit 1; fi
      - name: Actions fixadas por SHA de commit
        run: |
          bad=$(grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE 'uses:\s*[^@]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then echo "::error::actions sem SHA:"; echo "$bad"; exit 1; fi
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
      - name: nginx -t (dev)
        run: |
          docker run --rm --add-host server:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.30.5-alpine nginx -t
      - name: nginx -t (prod e bootstrap, com certificado autoassinado descartável)
        run: |
          mkdir -p /tmp/le/live/factoryconnect.tech
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=factoryconnect.tech \
            -keyout /tmp/le/live/factoryconnect.tech/privkey.pem -out /tmp/le/live/factoryconnect.tech/fullchain.pem
          for f in nginx.prod.conf nginx.bootstrap.conf; do
            docker run --rm --add-host server:127.0.0.1 --add-host web:127.0.0.1 --add-host site:127.0.0.1 \
              -v "$PWD/infra/nginx/$f:/etc/nginx/nginx.conf:ro" -v /tmp/le:/etc/letsencrypt:ro \
              nginx:1.30.5-alpine nginx -t
          done
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh infra/mosquitto/prod/*.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Testes de infra (mosquitto prod auth/ACL/TLS, Traefik X-Forwarded-For, Prometheus/Grafana)
        run: |
          pip install pytest==8.3.5 uvicorn==0.34.3
          python -m pytest -q infra/tests

  # ── Backup → restore em containers novos ─────────────────────────
  backup:
    name: backup · restore em containers novos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: backup.sh → restore.sh (linhas por tabela e pontos por bucket conferidos)
        run: scripts/backup_restore_test.sh

  # ── Build das imagens Docker ─────────────────────────────────────
  docker:
    name: docker build · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server, context: server, target: "" }
          - { name: edge,   context: edge,   target: "" }
          - { name: web,    context: web,    target: prod }
          - { name: site,   context: site,   target: prod }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: factory-monitor-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
