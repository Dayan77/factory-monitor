# CI — roda em todo push e pull request. Nada vai para `main` vermelho:
# proteja a branch exigindo os jobs abaixo (Settings → Branches → Require status checks).
# Actions fixadas por SHA de commit (a tag fica no comentário). Para atualizar:
#   git ls-remote --tags https://github.com/<owner>/<action> | grep 'v4.4.0^{}'  (ou a tag leve, se não houver ^{})
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Server (FastAPI) ─────────────────────────────────────────────
  server:
    name: server · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: factory_monitor
          POSTGRES_USER: fm_user
          POSTGRES_PASSWORD: fm_dev_password   # banco efêmero do CI, não é segredo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm_user -d factory_monitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
      influxdb:
        image: influxdb:2.7.12-alpine
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: ci-admin-password
          DOCKER_INFLUXDB_INIT_ORG: factory-monitor
          DOCKER_INFLUXDB_INIT_BUCKET: sensors
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-change-me
        ports: ["8086:8086"]
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fm_user
      POSTGRES_PASSWORD: fm_dev_password
      INFLUX_URL: http://localhost:8086
      INFLUX_TOKEN: dev-token-change-me
      INFLUX_ORG: factory-monitor
      INFLUX_BUCKET: sensors
      MQTT_BROKER_HOST: localhost
      MQTT_BROKER_PORT: "1883"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mosquitto precisa do nosso mosquitto.conf (a config padrão da imagem só
      # escuta em loopback) — por isso não é um `service` do job.
      - name: Start mosquitto
        run: |
          docker run -d --name ci_mosquitto -p 1883:1883 \
            -v "$PWD/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for _ in $(seq 1 20); do
            docker exec ci_mosquitto mosquitto_pub -h localhost -t health -m ping && exit 0
            sleep 1
          done
          docker logs ci_mosquitto; exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r server/requirements-dev.txt -r scripts/requirements.txt
          pip check

      - name: Alembic upgrade head (banco limpo)
        working-directory: server
        env:
          POSTGRES_DB: factory_monitor
        run: alembic upgrade head

      - name: Casos da especificação de KPIs (docs/kpis.md)
        working-directory: server
        env:
          FM_TEST_DB: fm_test_kpi
        run: python -m pytest -q tests/test_kpi_spec_cases.py

      - name: Cenários de ouro (docs/scenarios — oráculo + conformidade com o server)
        run: python -m pytest -q docs/scenarios

      - name: pytest (server)
        working-directory: server
        env:
          FM_TEST_DB: fm_test_server
        run: python -m pytest -q

      - name: pytest (scripts de operação)
        run: python -m pytest -q scripts/tests

      - name: Consultas do sql-exporter contra o schema real (alertas de gateway/dead letters/demo)
        env:
          FM_SERVER_PYTHON: python
          FM_TEST_MON_DB: fm_test_monitoring
        run: python -m pytest -q -rs infra/tests/test_monitoring.py -k sql_exporter

  # ── Edge (gateway / simulador) ───────────────────────────────────
  edge:
    name: edge · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: edge/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r edge/requirements-dev.txt
          pip check

      - name: Import smoke test
        run: python -c "import edge.app, edge.src.gateway, edge.src.simulator"

      - name: pytest (edge)
        run: |
          if [ -d edge/tests ]; then
            python -m pytest -q edge/tests
          else
            echo "::warning::edge/tests não existe — nenhum teste de edge executado"
          fi

      - name: Server + edge no mesmo ambiente (sem conflito de dependências)
        run: |
          pip install -r server/requirements.txt
          pip check

  # ── Web (React + TS) ─────────────────────────────────────────────
  web:
    name: web · tsc + vitest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  # ── Site público (Astro estático) ────────────────────────────────
  site:
    name: site · astro check + vitest + build + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Typecheck (astro check)
        run: npx astro check
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx astro build
      - name: E2E no navegador (Playwright, desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          node tests/e2e.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          retention-days: 3
      - name: Roteamento de domínios (Traefik v3 e v2 com os labels de produção)
        run: python3 tests/traefik_routing.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-screenshots
          path: site/test-results/screens
          retention-days: 7

  # ── Cabeçalhos de segurança: nginx real + Chromium, com os builds REAIS do web e do site ─
  security-headers:
    name: security headers · nginx + CSP no Chromium
    needs: [web, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Playwright (do site) + Chromium
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: HSTS/CSP/nosniff/frame-ancestors em toda resposta + nenhuma violação de CSP no navegador
        run: |
          pip install pytest==8.3.5
          python -m pytest -q -rs infra/tests/test_security_headers.py

  # ── Infra: compose, nginx, scripts, mosquitto, Traefik, monitoring ─
  infra:
    name: infra · compose + nginx + shell + actionlint + mosquitto/traefik/monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .env de CI a partir do exemplo
        run: |
          grep -vE '^\s*(#|$)' .env.example | sed 's/[[:space:]]*#.*$//' > .env
          {
            echo "INFLUX_ADMIN_PASSWORD=ci-only"
            echo "MQTT_USERNAME=fm-backend"            # prod exige credencial MQTT do backend
            echo "MQTT_PASSWORD=ci-only-mqtt-password"
          } >> .env
      - name: docker compose config (dev, prod e staging; todos os profiles)
        run: |
          for f in infra/docker-compose.yml infra/docker-compose.prod.yml; do
            docker compose --env-file .env -f "$f" config -q
            docker compose --env-file .env -f "$f" --profile monitoring config -q
            docker compose --env-file .env -f "$f" --profile demo config -q
            docker compose --env-file .env -f "$f" --profile monitoring --profile demo config -q
          done
          docker compose --env-file .env -f infra/docker-compose.yml --profile sim config -q
          docker compose --env-file .env.staging.example -f infra/docker-compose.staging.yml config -q
      - name: Imagens com versão fixa (sem :latest em imagens de terceiros)
        run: |
          # imagens do app: ${FM_IMAGE_PREFIX:-factory-monitor}-<nome>:${FM_VERSION/DEMO_EDGE_IMAGE_TAG...}
          bad=$(grep -hE '^\s*image:' infra/docker-compose*.yml .github/workflows/*.yml \
                | sed -E 's/^\s*image:\s*//; s/\s*#.*$//' | grep -v '^factory-monitor-' \
                | grep -vE '^\$\{FM_IMAGE_PREFIX:-factory-monitor\}-[a-z]+:\$\{' \
                | grep -vE ':[0-9v][^:]*$' || true)
          if [ -n "$bad" ]; then echo "::error::imagens sem versão fixa:"; echo "$bad"; exit 1; fi
      - name: Actions fixadas por SHA de commit
        run: |
          bad=$(grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE 'uses:\s*[^@]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then echo "::error::actions sem SHA:"; echo "$bad"; exit 1; fi
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
      - name: nginx -t (dev)
        run: |
          docker run --rm --add-host server:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.30.5-alpine nginx -t
      - name: nginx -t (prod e bootstrap, com certificado autoassinado descartável)
        run: |
          mkdir -p /tmp/le/live/factoryconnect.tech
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=factoryconnect.tech \
            -keyout /tmp/le/live/factoryconnect.tech/privkey.pem -out /tmp/le/live/factoryconnect.tech/fullchain.pem
          for f in nginx.prod.conf nginx.bootstrap.conf; do
            docker run --rm --add-host server:127.0.0.1 --add-host web:127.0.0.1 --add-host site:127.0.0.1 \
              -v "$PWD/infra/nginx/$f:/etc/nginx/nginx.conf:ro" -v /tmp/le:/etc/letsencrypt:ro \
              nginx:1.30.5-alpine nginx -t
          done
      - name: nginx -t (containers web e site, com os cabeçalhos de segurança)
        run: |
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/web/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" nginx:1.30.5-alpine nginx -t
          mkdir -p /tmp/site-dist /tmp/site-ngx && echo '<script>1</script>' > /tmp/site-dist/index.html
          node site/scripts/render-nginx.mjs --dist /tmp/site-dist --out /tmp/site-ngx
          docker run --rm -v /tmp/site-ngx/default.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/site-ngx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro nginx:1.30.5-alpine nginx -t
      - name: Alertmanager (modelo renderizado + amtool check-config)
        run: |
          docker run --rm --entrypoint sh -e ALERT_EMAIL_TO=ops@example.com -e SMTP_HOST=smtp.example.com \
            -e SMTP_USER=u -e SMTP_PASSWORD=p -e SMTP_FROM=alerts@example.com -e ALERTMANAGER_CHECK_ONLY=1 \
            -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.34.1 \
            /etc/alertmanager/entrypoint.sh
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh infra/mosquitto/prod/*.sh infra/monitoring/alertmanager/*.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Testes de infra (mosquitto prod auth/ACL/TLS, Traefik X-Forwarded-For, Prometheus/Grafana)
        run: |
          pip install pytest==8.3.5 uvicorn==0.34.3
          python -m pytest -q infra/tests

  # ── Backup → restore em containers novos ─────────────────────────
  backup:
    name: backup · restore em containers novos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: backup.sh → restore.sh (linhas por tabela e pontos por bucket conferidos)
        run: scripts/backup_restore_test.sh

  # ── Build das imagens Docker + varredura (Trivy) + SBOM (CycloneDX) ─
  # Mesma política da release (.github/workflows/release.yml): HIGH/CRITICAL com correção disponível reprovam;
  # exceções justificadas em .github/security/trivyignore. SBOM de cada imagem fica como artefato do CI.
  docker:
    name: docker build + scan · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45              # arm64 do edge via QEMU
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server, context: server, target: "" }
          # o gateway roda em IPC x86-64 e em Raspberry Pi 4/5 (infra/gateway): valida também o arm64
          - { name: edge,   context: edge,   target: "",   arm64: true }
          - { name: web,    context: web,    target: prod }
          - { name: site,   context: site,   target: prod }
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, carregada no docker para a varredura)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          build-args: FM_VERSION=ci-${{ github.sha }}
          tags: factory-monitor-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Build linux/arm64 (só valida)
        if: matrix.arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
      - name: Trivy — vulnerabilidades HIGH/CRITICAL com correção reprovam
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.github/security/trivyignore \
            --exit-code 1 --format table "factory-monitor-${{ matrix.name }}:ci"
      - name: SBOM CycloneDX da imagem
        if: always()
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/out" \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --quiet --format cyclonedx \
            --output "/out/sbom-${{ matrix.name }}.cdx.json" "factory-monitor-${{ matrix.name }}:ci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-${{ matrix.name }}
          path: reports/sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
