# Release — dispara com uma tag vX.Y.Z na main (processo: docs/operations.md §11, CHANGELOG.md).
#
#   1. verify  — tag == "v" + VERSION, seção no CHANGELOG, commit da tag está na main
#   2. images  — para server, web, site, edge: build linux/amd64 → Trivy (HIGH/CRITICAL com correção reprova,
#                ANTES de publicar) → SBOM CycloneDX → build + push para o GHCR (edge também linux/arm64) com
#                proveniência SLSA (provenance mode=max + SBOM do buildx + attestation assinada do GitHub)
#   3. release — GitHub Release com as notas do CHANGELOG e os SBOMs anexados
# Tags das imagens: ghcr.io/<dono>/factoryconnect-<nome>:X.Y.Z, :X.Y, :sha-<commit> (nunca :latest).
# O deploy (workflow Deploy) é separado e manual, com aprovação no environment `production`.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  verify:
    name: verificar versão e changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        name: VERSION, CHANGELOG e main
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/release/check_release.py --tag "$TAG" --notes release-notes.md
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::a tag $TAG não aponta para um commit da main"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${OWNER,,}/factoryconnect" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  images:
    name: imagem · ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write          # push no GHCR
      id-token: write          # assinatura da attestation (Sigstore)
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: server, context: server, target: "",   platforms: linux/amd64 }
          - { name: web,    context: web,    target: prod, platforms: linux/amd64 }
          - { name: site,   context: site,   target: prod, platforms: linux/amd64 }
          - { name: edge,   context: edge,   target: "",   platforms: "linux/amd64,linux/arm64" }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE: ${{ needs.verify.outputs.prefix }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=factoryconnect-${{ matrix.name }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build para varredura (linux/amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            FM_VERSION=${{ env.VERSION }}
            EDGE_VERSION=${{ env.VERSION }}
          tags: scan/${{ matrix.name }}:${{ env.VERSION }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - name: Trivy — HIGH/CRITICAL com correção bloqueiam a publicação
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.github/security/trivyignore --exit-code 1 "scan/${{ matrix.name }}:$VERSION"
      - name: SBOM CycloneDX
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --quiet --format cyclonedx \
            --output "/out/factoryconnect-${{ matrix.name }}-$VERSION.cdx.json" "scan/${{ matrix.name }}:$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/*.cdx.json

      - id: push
        name: Build multi-plataforma + push (GHCR) com proveniência e SBOM do buildx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            FM_VERSION=${{ env.VERSION }}
            EDGE_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Resumo
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}:${VERSION}"
            echo "digest \`${DIGEST}\` — verificar: \`gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Criar a release com notas do CHANGELOG e SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "FactoryConnect $VERSION" \
            --notes-file artifacts/release-notes/release-notes.md $pre --verify-tag \
            artifacts/sbom-*/*.cdx.json
