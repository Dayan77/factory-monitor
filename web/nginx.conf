# Nginx do container do frontend em produção (atrás do Traefik: TLS termina nele).
# Cabeçalhos de segurança: nginx/security-headers.conf (em /etc/nginx/snippets/), incluído em CADA location com
# add_header próprio — senão o nginx descarta os do server{}.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Saúde do container (healthcheck do compose)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Service worker e manifest do PWA: sempre revalidar (senão o app do técnico não atualiza)
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location ~ ^/(manifest|op)\.webmanifest$ {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome (gerados pelo Vite em /assets/): cache de 1 ano
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Arquivos de public/ sem hash (theme-init.js, ícones, favicon): revalidar sempre (ETag → 304)
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA — todas as rotas para index.html (o HTML nunca fica em cache: um deploy novo aparece no próximo load)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
