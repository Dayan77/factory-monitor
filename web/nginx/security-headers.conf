# Cabeçalhos de segurança do app (app.factoryconnect.tech) — incluído no server{} E em todo location{} que tenha
# add_header próprio (no nginx, um add_header no location descarta os herdados do server).
# Testado em infra/tests/test_security_headers.py (nginx real + Chromium sem violação de CSP).
# A API (/api, /ws) vai direto do Traefik ao fm_server, que manda os próprios cabeçalhos (server/src/services/security/http.py).
#
# CSP: nenhum script inline (theme-init.js e manifest-init.js são arquivos em public/) → script-src 'self' sem
# 'unsafe-inline'. style-src precisa de 'unsafe-inline' (atributos style= do React/Recharts; sem risco de execução).
# blob: = hls.js (MSE + worker), plantas baixas e downloads de relatório (URL.createObjectURL).
# connect-src: mesma origem + WebSocket da mesma origem (wss://$host; 'self' cobre ws(s) nos navegadores atuais).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss://$host; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# HSTS pronto para preload (2 anos, subdomínios, preload). Só vale em HTTPS (navegador ignora em http://localhost).
# ATENÇÃO antes de submeter a hstspreload.org: TODOS os subdomínios de factoryconnect.tech precisam ter HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): leitura de código de barras no app do técnico (BarcodeDetector + getUserMedia)
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
