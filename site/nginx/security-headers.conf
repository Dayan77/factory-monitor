# Cabeçalhos de segurança do site público (factoryconnect.tech) — modelo: scripts/render-nginx.mjs troca
# __CSP_SCRIPT_HASHES__ (hash de cada script inline do build) e __CONNECT_SRC__ (API do formulário de contato).
# Incluído no server{} e em todo location{} com add_header próprio (o nginx não herda add_header nesses casos).
# script-src sem 'unsafe-inline': só arquivos do próprio site + os scripts inline cujo hash bate com o build.
# style-src mantém 'unsafe-inline': CSS embutido pelo Astro (inlineStylesheets) e atributos style= (sem execução).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __CONNECT_SRC__; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
# HSTS pronto para preload (2 anos + subdomínios + preload) — antes de submeter a hstspreload.org confira que
# TODOS os subdomínios (app, staging, mqtt, www) respondem em HTTPS (docs/go_live.md §2).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
