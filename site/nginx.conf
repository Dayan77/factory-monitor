# nginx do site público (factoryconnect.tech) — arquivos estáticos gerados pelo Astro.
# MODELO: scripts/render-nginx.mjs gera o default.conf final no build da imagem (Dockerfile) com os hashes CSP dos
# scripts inline; cabeçalhos de segurança em nginx/security-headers.conf (→ /etc/nginx/snippets/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml image/svg+xml image/x-icon;

    include /etc/nginx/snippets/security-headers.conf;

    # /pagina.html → /pagina (URL canônica sem extensão; /index.html → /index → /)
    if ($request_uri ~ ^/index\.html(?:\?.*)?$) { return 301 /; }
    if ($request_uri ~ ^/([^?]*)\.html(?:\?.*)?$) { return 301 /$1; }

    # Saúde do container (healthcheck)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Assets com hash no nome (Astro) — cache longo
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|ico|svg|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # URLs limpas: /solucao → solucao.html; /solucao/ → /solucao
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /index { return 301 /; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
