# nginx do site público (factoryconnect.tech) — arquivos estáticos gerados pelo Astro.
# Template processado pelo entrypoint da imagem oficial (envsubst só troca variáveis definidas,
# aqui ${SITE_CONNECT_SRC}); variáveis do nginx como $uri ficam intactas.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml image/svg+xml image/x-icon;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${SITE_CONNECT_SRC}; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # /pagina.html → /pagina (URL canônica sem extensão; /index.html → /index → /)
    if ($request_uri ~ ^/index\.html(?:\?.*)?$) { return 301 /; }
    if ($request_uri ~ ^/([^?]*)\.html(?:\?.*)?$) { return 301 /$1; }

    # Saúde do container (healthcheck)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Assets com hash no nome (Astro) — cache longo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|ico|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # URLs limpas: /solucao → solucao.html; /solucao/ → /solucao
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${SITE_CONNECT_SRC}; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /index { return 301 /; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
