# Prometheus de PRODUÇÃO (profile "monitoring" de infra/docker-compose.prod.yml).
# Coleta o backend pela rede interna fm-net — /metrics não é publicado no Traefik.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fm-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
