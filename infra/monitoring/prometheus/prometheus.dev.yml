# Prometheus de DEV (profile "monitoring" de infra/docker-compose.yml).
# Dois alvos possíveis do backend; só um estará de pé:
#   server:8000                → backend no compose (make dev)
#   host.docker.internal:8000  → backend local (uvicorn fora do docker, make infra)
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: development

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fm-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000", "host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
