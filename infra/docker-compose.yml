# FactoryConnect — ambiente de DESENVOLVIMENTO.
#
# Use pelo Makefile na raiz (ele passa --env-file .env, de onde vêm as variáveis):
#   make dev      # stack completa: http://localhost (nginx → web + /api)
#   make infra    # só postgres + influxdb + mosquitto + mediamtx (backend/frontend rodando local)
#
# Equivalente manual: docker compose --env-file .env -f infra/docker-compose.yml up -d
# (sem --env-file o compose procura infra/.env e as variáveis ficam vazias).
#
# Planta virtual (profile "sim"): CLPs simulados + provisionamento + gateway edge real.
#   docker compose --env-file .env -f infra/docker-compose.yml --profile sim up -d
#   VP_SPEED=60 (1 h simulada/min), VP_SEED=42, VP_SHIFTS=06:00-14:00,14:00-22:00 ajustam a simulação.
#   Playback de cenário de ouro (docs/scenarios montado em /scenarios), relógio do cenário deslocado:
#     VP_SCENARIO=/scenarios/scenario_c_oee_shift.json VIRTUAL_PLANT_MAX_CLOCK_SKEW_S=off VP_SPEED=60 \
#       docker compose --env-file .env -f infra/docker-compose.yml --profile sim up -d
#   Estado/verdade de campo: curl http://localhost:8091/state
#
# Todas as imagens têm versão fixa. Atualize de propósito, nunca via :latest.

services:
  # ── Databases ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine
    container_name: fm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-fm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode via make / --env-file .env)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7.12-alpine
    container_name: fm_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-factory-monitor}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
      # Limites de memória (docs/performance.md §5.1): sem eles uma consulta/compactação descontrolada levou o
      # influxd a ~14 GB e o OOM killer do kernel o matou em loop (Sprint 7b). Com eles a consulta que estoura
      # falha sozinha e o contêiner nunca derruba o Postgres/API do mesmo host.
      INFLUXD_QUERY_CONCURRENCY: ${INFLUXD_QUERY_CONCURRENCY:-16}
      INFLUXD_QUERY_QUEUE_SIZE: ${INFLUXD_QUERY_QUEUE_SIZE:-64}
      INFLUXD_QUERY_INITIAL_MEMORY_BYTES: ${INFLUXD_QUERY_INITIAL_MEMORY_BYTES:-16777216}
      INFLUXD_QUERY_MEMORY_BYTES: ${INFLUXD_QUERY_MEMORY_BYTES:-1073741824}
      INFLUXD_QUERY_MAX_MEMORY_BYTES: ${INFLUXD_QUERY_MAX_MEMORY_BYTES:-2147483648}
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: ${INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE:-536870912}
      INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS: ${INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS:-1}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MQTT Broker ───────────────────────────────────────────────────
  # Exposto em todas as interfaces para gateways edge na LAN de testes.
  # Dev apenas: allow_anonymous (produção exige auth/TLS — roadmap Fase 6).
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: fm_mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MediaMTX (RTSP → HLS) ─────────────────────────────────────────
  # O browser nunca fala direto com ele: o fm_server faz proxy em /api/cameras/{id}/hls/.
  # Portas publicadas só em 127.0.0.1 para o backend rodando fora do Docker
  # (MEDIAMTX_API_URL=http://localhost:9997, MEDIAMTX_HLS_URL=http://localhost:8888).
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: fm_mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9997:9997"

  # ── Backend (FastAPI) ─────────────────────────────────────────────
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: factory-monitor-server:dev
    container_name: fm_server
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      INFLUX_URL: http://influxdb:8086
      MQTT_BROKER_HOST: mosquitto
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ../server:/app
    # Migrations antes de subir a API (idempotente)
    # --no-proxy-headers: X-Forwarded-For é tratado só no app (FORWARDED_ALLOW_IPS), como na imagem de produção
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Frontend (React / Vite dev server) ────────────────────────────
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    image: factory-monitor-web:dev
    container_name: fm_web
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
    depends_on:
      - server
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../web:/app
      - /app/node_modules

  # ── Reverse Proxy (Nginx) ─────────────────────────────────────────
  nginx:
    image: nginx:1.30.5-alpine
    container_name: fm_nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"

  # ── Planta virtual + gateway edge (profile "sim") ─────────────────
  # virtual-plant: OPC UA :4840 e Modbus TCP :5020 da "Planta Manaus" (edge/virtual_plant).
  # provision-sim: cria plant/linhas/máquinas/posições/componentes/tags via REST e grava os tag_id
  #                em /data/plant.local.json (idempotente; roda a cada `up`).
  # gateway-sim:   gateway edge real lendo a planta pelo mapa → MQTT (mesmo caminho de uma fábrica).
  # O simulador antigo (python -m edge.src.simulator) continua disponível fora do compose.
  virtual-plant:
    profiles: ["sim"]
    build:
      context: ../edge
      dockerfile: Dockerfile
    image: factory-monitor-edge:dev
    container_name: fm_virtual_plant
    restart: unless-stopped
    command: ["python", "-m", "virtual_plant", "--host", "0.0.0.0"]
    environment:
      VP_SEED: ${VP_SEED:-42}
      VP_SPEED: ${VP_SPEED:-1}
      VP_SHIFTS: ${VP_SHIFTS:-}
      # playback de cenário (vazio = planta normal); o gateway precisa de VIRTUAL_PLANT_MAX_CLOCK_SKEW_S=off
      VP_SCENARIO: ${VP_SCENARIO:-}
      VP_SCENARIO_CLOCK: ${VP_SCENARIO_CLOCK:-shifted}
      VP_SCENARIO_START: ${VP_SCENARIO_START:-subscribe}
      VP_SCENARIO_HEARTBEAT_S: ${VP_SCENARIO_HEARTBEAT_S:-10}
    volumes:
      - ../docs/scenarios:/scenarios:ro
    ports:
      - "127.0.0.1:4840:4840"
      - "127.0.0.1:5020:5020"
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  provision-sim:
    profiles: ["sim"]
    image: factory-monitor-edge:dev
    container_name: fm_provision_sim
    restart: "no"
    # com VP_SCENARIO, o mapa provisionado traz o calendário do cenário (turno + pausas) — mesmo layout da planta
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -n "$$VP_SCENARIO" ]; then
        python -m virtual_plant --write-map /data/plant.scenario.json --scenario "$$VP_SCENARIO" &&
        exec python -m src.provision --server http://server:8000 --map /data/plant.scenario.json --out /data/plant.local.json;
        else exec python -m src.provision --server http://server:8000 --out /data/plant.local.json; fi
    environment:
      VP_SCENARIO: ${VP_SCENARIO:-}
      # usuário admin do seed de desenvolvimento (make seed); sobrescreva no .env se mudou
      PROVISION_EMAIL: ${SIM_EMAIL:-admin@factory-monitor.com}
      PROVISION_PASSWORD: ${SIM_PASSWORD:-Admin@1234}
      # mesma aceleração da planta: ajusta max_rate_per_s dos contadores (senão o servidor os descarta)
      PROVISION_SPEED: ${VP_SPEED:-1}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - edge-sim-data:/data
      - ../docs/scenarios:/scenarios:ro

  gateway-sim:
    profiles: ["sim"]
    image: factory-monitor-edge:dev
    container_name: fm_gateway_sim
    restart: unless-stopped
    environment:
      PLANT_MAP_PATH: /data/plant.local.json
      VIRTUAL_PLANT_HOST: virtual-plant
      # playback de cenário (relógio deslocado/acelerado): off — senão o relógio do CLP vira "não confiável"
      VIRTUAL_PLANT_MAX_CLOCK_SKEW_S: ${VIRTUAL_PLANT_MAX_CLOCK_SKEW_S:-2}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      BUFFER_DB_PATH: /data/edge_buffer.db
      COUNTER_DB_PATH: /data/edge_counters.db
      # Dev: payload em claro. Para cifrar, a MESMA chave AES-256 (32 bytes) no server e aqui.
      ENCRYPTION_KEY: ""
    depends_on:
      provision-sim:
        condition: service_completed_successfully
      virtual-plant:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - edge-sim-data:/data

  # ── Observabilidade (profile "monitoring") ────────────────────────
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile monitoring up -d   (ou: make monitoring)
  #   Prometheus http://localhost:9090 · Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD, padrão admin)
  # Coleta o backend do compose (server:8000) ou o local (host.docker.internal:8000).
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: fm_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    container_name: fm_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  edge-sim-data:
  postgres-data:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
  prometheus-data:
  grafana-data:
