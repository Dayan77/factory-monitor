version: "3.9"

services:
  # ── Databases ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: fm_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MQTT Broker ───────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fm_mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"   # WebSocket

  # ── Backend (FastAPI) ─────────────────────────────────────────────
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: fm_server
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../server:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Edge Gateway ──────────────────────────────────────────────────
  edge:
    build:
      context: ../edge
      dockerfile: Dockerfile
    container_name: fm_edge
    restart: unless-stopped
    env_file: ../.env
    environment:
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      - mosquitto
    volumes:
      - ../edge:/app

  # ── Frontend (React) ──────────────────────────────────────────────
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    container_name: fm_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ../web:/app
      - /app/node_modules

  # ── Reverse Proxy (Nginx) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fm_nginx
    restart: unless-stopped
    depends_on:
      - server
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  postgres-data:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
