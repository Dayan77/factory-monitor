listener 1883
listener 9001
protocol websockets

allow_anonymous true

# Contrapressão (ver infra/mosquitto/prod/mosquitto.conf): o servidor confirma leituras QoS 1 só quando
# tem espaço; o backlog fica nesta fila do broker.
max_inflight_messages 100
max_queued_messages 2000000
max_queued_bytes 536870912

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
