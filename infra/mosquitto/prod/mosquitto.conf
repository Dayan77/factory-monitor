# Mosquitto de PRODUÇÃO (infra/docker-compose.prod.yml). O dev continua anônimo em ../mosquitto.conf.
#
# - Nunca anônimo: todo cliente autentica (password_file) e só acessa o que o acl_file permite.
# - password_file e acl_file são GERADOS na partida do container por render.sh a partir de:
#     MQTT_SERVER_USERNAME / MQTT_SERVER_PASSWORD   → usuário do backend (lê factory/#)
#     /mosquitto/gateways/gateways.conf              → 1 linha por gateway: <usuário> <tenant_id> <hash>
#                                                      (criado por `make mqtt-gateway-add`, fora do git)
#   Recarregar após mudar gateways: `make mqtt-reload` (re-renderiza e manda SIGHUP; sem derrubar conexões).
# - Listener 1883: só dentro da rede docker (não publicado no host) — usado pelo fm_server e pelo healthcheck.
# - Listener 8883 (TLS): incluído por render.sh em /mosquitto/runtime/conf.d/tls.conf quando MQTT_TLS_ENABLED=true;
#   é a porta dos gateways de campo.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/runtime/passwd
acl_file /mosquitto/runtime/acl

listener 1883

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Logs no stdout (docker logs fm_mosquitto); connection_messages registra conexões/recusas por usuário.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Limites contra abuso de um gateway comprometido.
max_packet_size 262144
max_inflight_messages 100
max_queued_messages 10000

include_dir /mosquitto/runtime/conf.d
