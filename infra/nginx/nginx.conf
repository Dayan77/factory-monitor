# Nginx do ambiente de DEV (infra/docker-compose.yml) — porta 80 → server:8000 e web:5173.
# As rotas do FastAPI JÁ incluem o prefixo /api (ex.: /api/health, /api/auth/login),
# então o proxy_pass NÃO tem URI: o caminho original é repassado sem cortar /api.

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        server server:8000;
    }

    upstream frontend {
        server web:5173;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: never forward a client-supplied XFF
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # API REST, Swagger (/api/docs, /api/openapi.json) e HLS proxy das câmeras
        # /api/x → http://server:8000/api/x
        # recálculos síncronos longos (preferir ?background=true) — ver nginx.prod.conf
        location ~ ^/api/(predictive|usage)/recompute$ {
            proxy_pass http://api;
            proxy_read_timeout 900s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_buffering off;
        }

        # WebSocket — /ws/x → http://server:8000/ws/x
        location /ws/ {
            proxy_pass http://api;
            proxy_read_timeout 86400;
        }

        # Frontend (Vite dev server, com HMR via WebSocket)
        location / {
            proxy_pass http://frontend;
        }
    }
}
