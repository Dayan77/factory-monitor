events {
    worker_connections 1024;
}

http {
    upstream api      { server server:8000; }
    upstream frontend { server web:80; }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── HTTP: ACME challenge + redirect para HTTPS ────────────────────
    server {
        listen 80;
        server_name factoryconnect.tech www.factoryconnect.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://factoryconnect.tech$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name factoryconnect.tech www.factoryconnect.tech;

        ssl_certificate     /etc/letsencrypt/live/factoryconnect.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/factoryconnect.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

        # Métricas — acesso interno apenas
        location /metrics {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://api/metrics;
        }

        # Login com rate limit apertado
        location = /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://api/api/auth/login;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API REST
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket (tempo real)
        location /ws/ {
            proxy_pass         http://api/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400;
        }

        # Frontend SPA
        location / {
            proxy_pass          http://frontend/;
            proxy_set_header    Host $host;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
