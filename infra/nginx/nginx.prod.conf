# Substitua SEU_DOMINIO pelo seu domínio real (ex: monitor.suaempresa.com)
# Após obter o certificado SSL, descomente o bloco HTTPS

events {
    worker_connections 1024;
}

http {
    upstream api    { server server:8000; }
    upstream frontend { server web:80; }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── HTTP → redireciona para HTTPS (ativar após SSL) ────────────
    # server {
    #     listen 80;
    #     server_name SEU_DOMINIO;
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }

    # ── HTTP (temporário, antes do SSL) ──────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge para Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate limit apenas no login
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://api/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics (interno apenas)
        location /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api/metrics;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Frontend (SPA — todas as rotas para index.html)
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }

    # ── HTTPS (ativar após: certbot certonly --webroot ...) ──────────
    # server {
