# Configuração temporária — usada ANTES de obter o certificado SSL
# Substitua por nginx.prod.conf depois do certbot

events { worker_connections 1024; }

http {
    upstream api      { server server:8000; }
    upstream frontend { server web:80; }

    server {
        listen 80;
        server_name factoryconnect.tech www.factoryconnect.tech;

        # ACME challenge (Let's Encrypt precisa disso para validar o domínio)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://api/api/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass         http://api/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://frontend/;
        }
    }
}
