# Configuração temporária — usada ANTES de obter o certificado SSL
# Substitua por nginx.prod.conf depois do certbot (certificado com factoryconnect.tech, www e app)

events { worker_connections 1024; }

http {
    upstream api      { server server:8000; }
    upstream frontend { server web:80; }
    upstream site     { server site:80; }

    server {
        listen 80;
        server_name app.factoryconnect.tech;

        # ACME challenge (Let's Encrypt precisa disso para validar o domínio)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://api/api/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never forward a client-supplied XFF
        }

        location /ws/ {
            proxy_pass         http://api/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://frontend/;
        }
    }

    # Site público (apex e www) — HTTP enquanto não há certificado
    server {
        listen 80;
        server_name factoryconnect.tech www.factoryconnect.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass       http://site;
            proxy_set_header Host $host;
        }
    }
}
