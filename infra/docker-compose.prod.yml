# Produção (VPS). Rodar sempre com --env-file para a interpolação das variáveis:
#   docker compose --env-file /opt/factory-monitor/.env -f infra/docker-compose.prod.yml up -d
# Imagens com versão fixa — atualize de propósito, nunca via :latest.
# Usa o Traefik já instalado pelo Easypanel para roteamento.
# Domínios (DNS A → VPS para os três):
#   factoryconnect.tech        → site público estático (site/)        · www.factoryconnect.tech → 301 para o apex
#   app.factoryconnect.tech    → app React (web) + API/WebSocket (server)
#   Rotas antigas do app no apex (/login, /dashboard, /api, …) → 301/308 para app.factoryconnect.tech (mesmo caminho).
# Os containers site, server e web são expostos via labels do Traefik na rede easypanel.

services:
  # ── Databases ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine
    container_name: fm_postgres
    restart: always
    env_file: ../.env   # = /opt/factory-monitor/.env no VPS
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fm-net]

  influxdb:
    image: influxdb:2.7.12-alpine
    container_name: fm_influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fm-net]

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: fm_mosquitto
    restart: always
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fm-net]

  # ── MediaMTX (RTSP → HLS proxy) ──────────────────────────────────
  # Accessed internally by fm_server only (no Traefik exposure needed).
  # HLS streams proxied to browser via GET /api/cameras/{id}/hls/...
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: fm_mediamtx
    restart: always
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks: [fm-net]

  # ── Backend (FastAPI) ─────────────────────────────────────────────
  server:
    image: factory-monitor-server:latest
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: fm_server
    restart: always
    env_file: ../.env   # = /opt/factory-monitor/.env no VPS
    environment:
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.fm-api.rule=Host(`app.factoryconnect.tech`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/metrics`))"
      - "traefik.http.routers.fm-api.priority=200"
      - "traefik.http.routers.fm-api.entrypoints=https"
      - "traefik.http.routers.fm-api.tls=true"
      - "traefik.http.routers.fm-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.fm-api.loadbalancer.server.port=8000"
    networks:
      - fm-net
      - easypanel

  # ── Frontend (React/Nginx) ────────────────────────────────────────
  web:
    image: factory-monitor-web:latest
    build:
      context: ../web
      dockerfile: Dockerfile
      target: prod
    container_name: fm_web
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.fm-web.rule=Host(`app.factoryconnect.tech`)"
      - "traefik.http.routers.fm-web.entrypoints=https"
      - "traefik.http.routers.fm-web.tls=true"
      - "traefik.http.routers.fm-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.fm-web.loadbalancer.server.port=80"
      # Redirecionar HTTP → HTTPS
      - "traefik.http.routers.fm-web-http.rule=Host(`app.factoryconnect.tech`)"
      - "traefik.http.routers.fm-web-http.entrypoints=http"
      - "traefik.http.routers.fm-web-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    networks:
      - fm-net
      - easypanel

  # ── Site público (Astro estático + nginx) ─────────────────────────
  site:
    image: factory-monitor-site:latest
    build:
      context: ../site
      dockerfile: Dockerfile
      args:
        PUBLIC_APP_URL: https://app.factoryconnect.tech
        PUBLIC_API_URL: https://app.factoryconnect.tech
        PUBLIC_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    container_name: fm_site
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.services.fm-site.loadbalancer.server.port=80"
      # factoryconnect.tech → site
      - "traefik.http.routers.fm-site.rule=Host(`factoryconnect.tech`)"
      - "traefik.http.routers.fm-site.entrypoints=https"
      - "traefik.http.routers.fm-site.tls=true"
      - "traefik.http.routers.fm-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fm-site.service=fm-site"
      # www.factoryconnect.tech → factoryconnect.tech (mesmo caminho)
      - "traefik.http.routers.fm-site-www.rule=Host(`www.factoryconnect.tech`)"
      - "traefik.http.routers.fm-site-www.entrypoints=https"
      - "traefik.http.routers.fm-site-www.tls=true"
      - "traefik.http.routers.fm-site-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fm-site-www.middlewares=fm-www-to-apex"
      - "traefik.http.routers.fm-site-www.service=fm-site"
      - "traefik.http.middlewares.fm-www-to-apex.redirectregex.regex=^https?://www\\.factoryconnect\\.tech(:[0-9]+)?/(.*)"
      - "traefik.http.middlewares.fm-www-to-apex.redirectregex.replacement=https://factoryconnect.tech/$${2}"
      - "traefik.http.middlewares.fm-www-to-apex.redirectregex.permanent=true"
      # Rotas antigas do app no apex → app.factoryconnect.tech (mantém caminho e query; POST /api vira 308)
      - "traefik.http.routers.fm-legacy-app.rule=Host(`factoryconnect.tech`) && (Path(`/login`) || PathPrefix(`/login/`) || Path(`/register`) || PathPrefix(`/register/`) || Path(`/dashboard`) || PathPrefix(`/dashboard/`) || Path(`/factory`) || PathPrefix(`/factory/`) || Path(`/machines`) || PathPrefix(`/machines/`) || Path(`/lines`) || PathPrefix(`/lines/`) || Path(`/sensors`) || PathPrefix(`/sensors/`) || Path(`/cameras`) || PathPrefix(`/cameras/`) || Path(`/alerts`) || PathPrefix(`/alerts/`) || Path(`/ai`) || PathPrefix(`/ai/`) || Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/api`) || PathPrefix(`/api/`) || Path(`/ws`) || PathPrefix(`/ws/`))"
      - "traefik.http.routers.fm-legacy-app.priority=300"
      - "traefik.http.routers.fm-legacy-app.entrypoints=https"
      - "traefik.http.routers.fm-legacy-app.tls=true"
      - "traefik.http.routers.fm-legacy-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fm-legacy-app.middlewares=fm-legacy-to-app"
      - "traefik.http.routers.fm-legacy-app.service=fm-site"
      - "traefik.http.middlewares.fm-legacy-to-app.redirectregex.regex=^https?://factoryconnect\\.tech(:[0-9]+)?/(.*)"
      - "traefik.http.middlewares.fm-legacy-to-app.redirectregex.replacement=https://app.factoryconnect.tech/$${2}"
      - "traefik.http.middlewares.fm-legacy-to-app.redirectregex.permanent=true"
      # HTTP → HTTPS (apex e www; o middleware redirect-https é definido no serviço web)
      - "traefik.http.routers.fm-site-http.rule=Host(`factoryconnect.tech`) || Host(`www.factoryconnect.tech`)"
      - "traefik.http.routers.fm-site-http.entrypoints=http"
      - "traefik.http.routers.fm-site-http.middlewares=redirect-https"
      - "traefik.http.routers.fm-site-http.service=fm-site"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - easypanel

networks:
  fm-net:
    driver: bridge
  easypanel:
    external: true

volumes:
  postgres-data:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
