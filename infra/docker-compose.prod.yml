version: "3.9"

# Usa o Traefik já instalado pelo Easypanel para roteamento.
# Os containers server e web são expostos via labels do Traefik na rede easypanel.

services:
  # ── Databases ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fm_postgres
    restart: always
    env_file: /opt/factory-monitor/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fm-net]

  influxdb:
    image: influxdb:2.7-alpine
    container_name: fm_influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fm-net]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fm_mosquitto
    restart: always
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fm-net]

  # ── Backend (FastAPI) ─────────────────────────────────────────────
  server:
    image: factory-monitor-server:latest
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: fm_server
    restart: always
    env_file: /opt/factory-monitor/.env
    environment:
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.fm-api.rule=Host(`factoryconnect.tech`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/metrics`))"
      - "traefik.http.routers.fm-api.priority=10"
      - "traefik.http.routers.fm-api.entrypoints=https"
      - "traefik.http.routers.fm-api.tls=true"
      - "traefik.http.routers.fm-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.fm-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.fm-api-http.rule=Host(`factoryconnect.tech`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/metrics`))"
      - "traefik.http.routers.fm-api-http.priority=10"
      - "traefik.http.routers.fm-api-http.entrypoints=http"
      - "traefik.http.routers.fm-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.fm-api-http.service=fm-api"
    networks:
      - fm-net
      - easypanel

  # ── Frontend (React/Nginx) ────────────────────────────────────────
  web:
    image: factory-monitor-web:latest
    build:
      context: ../web
      dockerfile: Dockerfile
      target: prod
    container_name: fm_web
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.fm-web.rule=Host(`factoryconnect.tech`)"
      - "traefik.http.routers.fm-web.entrypoints=https"
      - "traefik.http.routers.fm-web.tls=true"
      - "traefik.http.routers.fm-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.fm-web.loadbalancer.server.port=80"
      # Redirecionar HTTP → HTTPS
      - "traefik.http.routers.fm-web-http.rule=Host(`factoryconnect.tech`)"
      - "traefik.http.routers.fm-web-http.entrypoints=http"
      - "traefik.http.routers.fm-web-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
    networks:
      - fm-net
      - easypanel

networks:
  fm-net:
    driver: bridge
  easypanel:
    external: true

volumes:
  postgres-data:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
